<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MX Stream">
<title>MX Stream</title>
<link rel="apple-touch-icon" sizes="180x180" id="appIcon">
<link rel="stylesheet" href="web/css/base.css">
<link rel="stylesheet" href="web/css/app.css">
<script src="/socket.io/socket.io.js"></script>
<script src="web/config.js"></script>
<script src="web/config.local.js" onerror="void 0"></script>
</head>
<body>

<div id="bg"></div>
<div id="bgTint"></div>
<div id="scrim"></div>

<div id="toast"></div>

<div id="topBar">
  <div class="topBtn na" id="btnRotelPower" title="Rotel ein/aus">
    <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
  </div>
  <div id="topRight">
    <div class="topBtn" id="btnStage" title="Layout wechseln (Display mit Lyrics)">
      <svg viewBox="0 0 24 24"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v12h7V6H4zm9 0v12h7V6h-7zM5 7h5v4H5V7zm0 5.5h5V14H5v-1.5zm9-5.5h5v1.5h-5V7zm0 3h5v1.5h-5V10zm0 3h5v1.5h-5V13z"/></svg>
    </div>
    <div class="topBtn" id="btnVolumio" title="Volumio-Oberfläche">
      <svg viewBox="0 0 24 24"><path d="M3 4h4.2l4.8 11.3L16.8 4H21l-7 16h-4L3 4z"/></svg>
    </div>
  </div>
</div>

<div id="app">
  <div id="topSpacer"></div>
  <div id="coverWrap"><img id="cover" alt=""></div>
  <div id="rightPane">
    <div id="meta">
      <div id="mArtist"></div>
      <div id="mTitle"></div>
      <div id="mAlbum"></div>
      <div id="mTechRow"><span id="mBadge" class="qBadge"></span><span id="mTech"></span></div>
    </div>
    <div id="seekWrap">
      <div id="seekBar"><div id="seekFill"></div></div>
      <div id="seekTimes">
        <span id="tElapsed">0:00</span>
        <span id="tRemain">0:00</span>
      </div>
    </div>
    <div id="ctrl">
      <div id="cRepeat">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        <span class="badge"></span>
      </div>
      <div class="ctrlBtn side" id="cPrev">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg>
      </div>
      <div class="ctrlBtn main" id="cPlay">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M7 5v14l12-7z"/></svg>
      </div>
      <div class="ctrlBtn side" id="cNext">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg>
      </div>
      <div id="cRandom">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </div>
    </div>

<div id="volWrap" class="off">
  <div class="vBtn" id="vMute"></div>
  <div class="vBtn" id="vDown"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></div>
  <input type="range" id="vSlider" min="0" max="70" step="1" value="0">
  <div class="vBtn" id="vUp"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>
  <div id="vVal">--</div>
</div>

  
  <div id="actions">
      <div class="actBtn" id="btnLyrics">
        <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 14H6l-2 2V4h16v12zM7 9h10v2H7zm0 4h7v2H7z"/></svg>
      </div>
      <div class="actBtn" id="btnInfo">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      </div>
      <div class="actBtn has-content" id="btnQueue">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h12v2H3z"/></svg>
      </div>
      <div class="actBtn has-content" id="btnPlaylists">
        <svg viewBox="0 0 24 24"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
      </div>
      <div class="actBtn has-content" id="btnSearch">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </div>
    </div>
  </div>
</div>

<!-- Lyrics-Overlay -->
<div class="overlay" id="overlayLyrics">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <h2>Lyrics</h2>
    <div class="overlayClose" id="closeLyrics">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div class="overlayBody"><div id="lyricsText"></div></div>
</div>

<!-- Info-Overlay -->
<div class="overlay" id="overlayInfo">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <h2 id="infoOverlayTitle">Info</h2>
    <div class="overlayClose" id="closeInfo">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div class="overlayBody" id="infoOverlayBody">
    <div id="infoTabs"></div>
    <div id="infoSlider"><div id="infoContent"></div></div>
  </div>
</div>

<!-- Queue-Overlay -->
<div class="overlay" id="overlayQueue">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <h2>Warteschlange</h2>
    <div class="overlayClose" id="closeQueue">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div id="queuePanels">
    <div id="queueList"></div>
  </div>
</div>

<!-- Playlisten/Radio-Overlay -->
<div class="overlay" id="overlayPlaylists">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <h2 id="plOverlayTitle">Playlisten</h2>
    <div class="overlayClose" id="closePlaylists">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div id="plTabBar">
    <div class="qTab on" id="plTab1">Playlisten</div>
    <div class="qTab" id="plTab2">Radio</div>
  </div>
  <div id="plPanels">
    <div id="playlistResults"></div>
    <div id="radioPanel"></div>
  </div>
</div>

<!-- Suche-Overlay -->
<div class="overlay" id="overlaySearch">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <h2>Suche</h2>
    <div id="searchSources">
      <label><input type="checkbox" id="srcLocal" checked> Lokal</label>
      <label><input type="checkbox" id="srcTidal" checked> TIDAL</label>
    </div>
    <div class="overlayClose" id="btnCheck" title="Bibliothek prüfen" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M3 5h11v2H3zm0 4h11v2H3zm0 4h7v2H3zm15.3 1.3l-2.8-2.8-1.4 1.4 4.2 4.2 6.7-6.7-1.4-1.4z" transform="translate(-1 0)"/></svg>
    </div>
    <div class="overlayClose" id="closeSearch">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div id="searchInputWrap">
    <div id="searchField">
      <input id="searchInput" type="search" placeholder="Mind. 2 Zeichen…"
        autocomplete="off" autocorrect="off" spellcheck="false">
      <div id="searchClear" title="Eingabe löschen">
        <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
      </div>
    </div>
    <button id="searchGoBtn">Los</button>
  </div>
  <div id="searchTabBar">
    <div class="qTab on" data-cat="artists">Künstler</div>
    <div class="qTab" data-cat="albums">Alben</div>
    <div class="qTab" data-cat="songs">Titel</div>
  </div>
  <div id="searchResults"></div>
</div>

<!-- Künstler-/Album-Overlay (Klick auf Künstler oder Album in der Wiedergabe) -->
<div class="overlay" id="overlayBrowse">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <div id="browseBack" title="Zurück" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <h2 id="browseTitle"></h2>
    <div class="overlayClose" id="closeBrowse">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div id="browseBody"></div>
</div>

<!-- Volumio-Overlay: direkter Zugang zu den Seiten der originalen Volumio-Oberfläche -->
<div class="overlay" id="overlayVolumio">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <h2>Volumio</h2>
    <a id="openVolumioTab" target="_blank" rel="noopener" title="In neuem Tab öffnen" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
    </a>
    <div class="overlayClose" id="closeVolumio">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div id="volumioTabBar"></div>
  <div id="volumioPanel"><div class="qHint" id="volumioHint">Seite wählen</div></div>
</div>


<!-- Bibliotheks-Check: Problemfälle der Sammlung, Stift öffnet den Tag-Editor darüber -->
<div class="overlay" id="overlayCheck">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <div id="checkBack" title="Zurück zur Suche">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <h2>Bibliothek prüfen</h2>
    <div class="overlayClose" id="closeCheck">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div class="overlayBody" id="checkBody"></div>
</div>

<!-- Tag-Editor (öffnet über dem Album-Overlay) -->
<div class="overlay" id="overlayTags">
  <div class="overlayHandle"></div>
  <div class="overlayHead">
    <h2 id="tagTitle">Tags bearbeiten</h2>
    <div class="overlayClose" id="closeTags">
      <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </div>
  </div>
  <div class="overlayBody" id="tagBody"></div>
  <div id="tagFoot">
    <div id="tagStatus"></div>
    <button id="tagUndo" style="display:none">Rückgängig</button>
    <button id="tagSave" disabled>Speichern</button>
  </div>
</div>

<script src="web/js/core.js"></script>
<script src="web/js/lyrics.js"></script>
<script src="web/js/controls.js"></script>
<script src="web/js/info.js"></script>
<script src="web/js/queue.js"></script>
<script src="web/js/library.js"></script>
<script src="web/js/marquee.js"></script>
<script src="web/js/browse.js"></script>
<script src="web/js/textfn.js"></script>
<script src="web/js/tagedit.js"></script>
<script src="web/js/check.js"></script>
<script src="web/js/ui.js"></script>
<script src="web/js/volumio.js"></script>
<script src="web/js/quality.js"></script>
<script src="web/js/mp4probe.js"></script>
<script src="web/js/color.js"></script>
<script src="web/js/poll.js"></script>
<script src="web/js/stage.js"></script>
</body>
</html>
